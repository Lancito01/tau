name: Release

# Every push to main builds, tests and publishes an MSI. Installed copies pick it up through the auto-updater.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAU_VERSION: 0.1.${{ github.run_number }}
  WIX_VERSION: 5.0.2

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: cargo test --release --locked

      # GITHUB_REPOSITORY and TAU_VERSION are compiled in. Local builds have neither, so they never update.
      - name: Build
        run: cargo build --release --locked

      - name: Build MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          New-Item -ItemType Directory -Force dist | Out-Null
          $msi = "dist/Tau-$env:TAU_VERSION.msi"
          wix build installer/tau.wxs -arch x64 -d "Version=$env:TAU_VERSION" -d "ExePath=target/release/tau.exe" -d "IconPath=target/tau.ico" -o $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $msi -Leaf)" | Set-Content -NoNewline -Encoding ascii "$msi.sha256"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:TAU_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag (Get-ChildItem dist/*).FullName --clobber
          } else {
            gh release create $tag (Get-ChildItem dist/*).FullName --title "Tau $env:TAU_VERSION" --generate-notes --target $env:GITHUB_SHA
          }
          exit $LASTEXITCODE
